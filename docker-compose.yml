services:
  fmkal-vehicle-contact:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fmkal-vehicle-contact
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      - NODE_ENV=production
      - PORT=1234
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - fmkal-data:/app/data
      - fmkal-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1234/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  fmkal-data:
    driver: local
  fmkal-uploads:
    driver: local
